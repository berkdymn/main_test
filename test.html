<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shopping Suggestions Dashboard</title>
  <style>
    :root {
      --bg: #0f172a;          /* slate-900 */
      --panel: #111827;       /* gray-900 */
      --muted: #94a3b8;       /* slate-400 */
      --text: #e5e7eb;        /* gray-200 */
      --accent: #22d3ee;      /* cyan-400 */
      --accent-2: #a78bfa;    /* violet-400 */
      --success: #34d399;     /* emerald-400 */
      --danger: #fb7185;      /* rose-400 */
      --card: #0b1220;        /* deep panel */
      --chip: #1f2937;        /* gray-800 */
      --border: #1f2937;
    }
    *{box-sizing:border-box}
    body{
      margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, "Apple Color Emoji","Segoe UI Emoji";
      background: radial-gradient(1200px 600px at 10% -10%, #1f2937 0%, #0b1220 50%, #030712 100%);
      color: var(--text);
    }
    header{
      padding: 24px 16px; border-bottom:1px solid var(--border);
      background: linear-gradient(180deg, rgba(34,211,238,.08), rgba(167,139,250,.08));
      position: sticky; top: 0; backdrop-filter: blur(6px); z-index: 10;
    }
    .wrap{ max-width:1100px; margin:0 auto; }
    h1{ margin:0; font-size: clamp(20px, 3vw, 28px); font-weight:700; letter-spacing:.3px }
    .subtitle{ color:var(--muted); margin-top:4px }

    /* Controls */
    .controls{ display:grid; grid-template-columns: 1fr 140px 140px 170px 120px; gap:10px; margin-top:16px }
    .control{ display:flex; align-items:center; gap:8px; background:var(--panel); border:1px solid var(--border); padding:8px 10px; border-radius:10px }
    .control input, .control select{
      background:transparent; border:none; outline:none; color:var(--text); width:100%; font-size:14px
    }
    .toggle{ display:flex; align-items:center; gap:8px; background:var(--panel); border:1px solid var(--border); padding:8px 10px; border-radius:10px; user-select:none }
    .toggle input{ accent-color: var(--accent) }
    .btn{ border:1px solid var(--border); background: var(--chip); color: var(--text); padding:10px 12px; border-radius:10px; cursor:pointer }
    .btn:disabled{ opacity:.6; cursor:not-allowed }

    /* Layout */
    main{ padding: 18px 16px 120px }
    .grid{ display:grid; grid-template-columns: repeat(auto-fill,minmax(220px,1fr)); gap:14px; margin-top:14px }

    /* Card */
    .card{ background: linear-gradient(180deg, rgba(34,211,238,.05), rgba(167,139,250,.03)), var(--card); border:1px solid var(--border); border-radius:14px; overflow:hidden; display:flex; flex-direction:column; min-height:320px }
    .img{ aspect-ratio: 4/3; background: #111827; display:grid; place-items:center; font-size:12px; color:var(--muted); }
    .img img{ width:100%; height:100%; object-fit:cover }
    .card .body{ padding:10px 12px; display:flex; flex-direction:column; gap:6px; flex:1 }
    .title{ font-size:15px; font-weight:600; line-height:1.2 }
    .meta{ display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--muted) }
    .chips{ display:flex; gap:6px; flex-wrap:wrap; margin-top:6px }
    .chip{ background: var(--chip); border:1px solid var(--border); padding:2px 8px; border-radius:999px; font-size:11px; color: var(--muted) }
    .price{ font-weight:700 }
    .stars{ color:gold; letter-spacing:1px; font-size:12px }
    .actions{ display:flex; gap:8px; margin-top:auto }
    .primary{ background: linear-gradient(90deg, var(--accent), var(--accent-2)); color:#00111a; border:none; font-weight:700 }
    .ghost{ background: transparent; border:1px dashed var(--accent); color: var(--text) }

    /* Compare bar */
    .compare{ position:fixed; bottom:0; left:0; right:0; background:rgba(2,6,23,.95); border-top:1px solid var(--border); padding:10px 16px; display:flex; align-items:center; gap:10px }
    .compare .items{ display:flex; gap:10px; overflow:auto; padding-bottom:4px }
    .pill{ background: var(--panel); border:1px solid var(--border); padding:6px 10px; border-radius:999px; font-size:12px; display:flex; align-items:center; gap:8px }
    .pill button{ background:transparent; color:var(--danger); border:none; cursor:pointer }
    .cmp-cta{ margin-left:auto }

    /* Small */
    @media (max-width: 880px){
      .controls{ grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1>Smart Shopper · Suggestions Dashboard</h1>
      <div class="subtitle">Search, filter and compare top-rated picks across the web.</div>
      <div class="controls" role="search" aria-label="Filters">
        <label class="control" title="Search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="1.6"/><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.6"/></svg>
          <input id="q" type="search" placeholder="Search products (e.g., headphones)" />
        </label>
        <label class="control">
          <span style="font-size:12px;color:var(--muted)">Category</span>
          <select id="cat">
            <option value="">All</option>
            <option>Headphones</option>
            <option>Laptops</option>
            <option>Monitors</option>
            <option>Smartwatches</option>
            <option>Kitchen</option>
          </select>
        </label>
        <label class="control">
          <span style="font-size:12px;color:var(--muted)">Max Price ($)</span>
          <input id="maxp" type="number" min="0" placeholder="No cap" />
        </label>
        <label class="control">
          <span style="font-size:12px;color:var(--muted)">Sort by</span>
          <select id="sort">
            <option value="best">Best Value</option>
            <option value="price_asc">Price: Low → High</option>
            <option value="price_desc">Price: High → Low</option>
            <option value="rating">Rating</option>
          </select>
        </label>
        <label class="toggle" title="Show only discounted items">
          <input id="onlyDeals" type="checkbox" /> Only deals
        </label>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div id="count" class="subtitle"></div>
    <section id="grid" class="grid" aria-live="polite"></section>
  </main>

  <div class="compare" aria-label="Compare bar">
    <div class="items" id="cmpItems"></div>
    <button id="btnCompare" class="btn primary cmp-cta" disabled>Compare (0)</button>
  </div>

  <template id="cardTpl">
    <article class="card">
      <div class="img" aria-hidden="true">Image</div>
      <div class="body">
        <div class="title"></div>
        <div class="meta">
          <span class="price"></span>
          <span class="stars" title="Rating">★★★★★</span>
        </div>
        <div class="chips"></div>
        <div class="actions">
          <button class="btn primary">View</button>
          <button class="btn ghost addcmp">+ Compare</button>
        </div>
      </div>
    </article>
  </template>

  <script>
    // --- Mock product data (replace with API results in real app) ---
    const PRODUCTS = [
      { id:1, title:"WH-1000XM5 Wireless Headphones", category:"Headphones", price: 329, rating: 4.8, deal:true, tags:["ANC","30h battery","Bluetooth 5.3"], img:"https://images.unsplash.com/photo-1518444136319-68e3d48f6a19?q=80&w=1200&auto=format&fit=crop" },
      { id:2, title:"AirRoast Pro Air Fryer 5qt", category:"Kitchen", price: 89, rating: 4.5, deal:true, tags:["Fast cook","Dishwasher safe"], img:"https://images.unsplash.com/photo-1544025162-d76694265947?q=80&w=1200&auto=format&fit=crop" },
      { id:3, title:"UltraSharp 27” 4K Monitor", category:"Monitors", price: 379, rating: 4.7, deal:false, tags:["IPS","USB‑C 90W"], img:"https://images.unsplash.com/photo-1517336714731-489689fd1ca8?q=80&w=1200&auto=format&fit=crop" },
      { id:4, title:"ThinkBook 14 (Ryzen 7, 16GB/512GB)", category:"Laptops", price: 749, rating: 4.6, deal:true, tags:["Lightweight","Wi‑Fi 6"], img:"https://images.unsplash.com/photo-1517336714731-489689fd1ca8?q=80&w=1200&auto=format&fit=crop" },
      { id:5, title:"KitchenMaster Immersion Blender", category:"Kitchen", price: 39, rating: 4.3, deal:false, tags:["5 speeds","Stainless"], img:"https://images.unsplash.com/photo-1544025162-d76694265947?q=80&w=1200&auto=format&fit=crop" },
      { id:6, title:"FitTrack S3 Smartwatch", category:"Smartwatches", price: 119, rating: 4.2, deal:true, tags:["GPS","Swim‑proof"], img:"https://images.unsplash.com/photo-1517433456452-f9633a875f6f?q=80&w=1200&auto=format&fit=crop" },
      { id:7, title:"Creator 15 OLED (32GB/1TB)", category:"Laptops", price: 1399, rating: 4.9, deal:false, tags:["RTX 4060","OLED"], img:"https://images.unsplash.com/photo-1518770660439-4636190af475?q=80&w=1200&auto=format&fit=crop" },
      { id:8, title:"Studio Monitor 24” (1080p)", category:"Monitors", price: 129, rating: 4.1, deal:true, tags:["75Hz","VESA"], img:"https://images.unsplash.com/photo-1517336714731-489689fd1ca8?q=80&w=1200&auto=format&fit=crop" },
    ];

    // Compute a simple "value score" = rating / log(price)
    const valueScore = p => (p.rating / Math.log(p.price + 10)).toFixed(3);

    // --- State & Elements ---
    const q = document.getElementById('q');
    const cat = document.getElementById('cat');
    const maxp = document.getElementById('maxp');
    const sort = document.getElementById('sort');
    const onlyDeals = document.getElementById('onlyDeals');
    const grid = document.getElementById('grid');
    const count = document.getElementById('count');
    const cardTpl = document.getElementById('cardTpl');
    const cmpItems = document.getElementById('cmpItems');
    const btnCompare = document.getElementById('btnCompare');

    const compareSet = new Map(); // id -> product

    const render = () => {
      const term = q.value.trim().toLowerCase();
      const c = cat.value;
      const cap = Number(maxp.value || Infinity);
      const deals = onlyDeals.checked;

      let items = PRODUCTS.filter(p =>
        (!term || p.title.toLowerCase().includes(term)) &&
        (!c || p.category === c) &&
        (p.price <= cap) &&
        (!deals || p.deal)
      );

      items.sort((a,b)=>{
        switch(sort.value){
          case 'price_asc': return a.price - b.price;
          case 'price_desc': return b.price - a.price;
          case 'rating': return b.rating - a.rating;
          default: return parseFloat(valueScore(b)) - parseFloat(valueScore(a)); // best value
        }
      });

      grid.innerHTML = '';
      items.forEach(p => grid.appendChild(makeCard(p)));
      count.textContent = `${items.length} result${items.length===1?'':'s'} · category: ${c||'All'}${deals?' · deals only':''}`;

      // update compare bar
      cmpItems.innerHTML = '';
      for (const [id, prod] of compareSet){
        const pill = document.createElement('div');
        pill.className = 'pill';
        pill.innerHTML = `<strong>${prod.title}</strong> · $${prod.price} <button aria-label="Remove">✕</button>`;
        pill.querySelector('button').onclick = () => { compareSet.delete(id); render(); };
        cmpItems.appendChild(pill);
      }
      const n = compareSet.size;
      btnCompare.disabled = n < 2;
      btnCompare.textContent = `Compare (${n})`;
    }

    function makeCard(p){
      const node = cardTpl.content.cloneNode(true);
      const img = node.querySelector('.img');
      img.innerHTML = `<img alt="${p.title}" src="${p.img}" loading="lazy">`;
      node.querySelector('.title').textContent = p.title;
      node.querySelector('.price').textContent = `$${p.price}`;
      node.querySelector('.stars').textContent = '★★★★★'.slice(0, Math.round(p.rating)) + '☆☆☆☆☆'.slice(Math.round(p.rating));

      const chips = node.querySelector('.chips');
      const val = document.createElement('span');
      val.className = 'chip';
      val.textContent = `Value score: ${valueScore(p)}`;
      chips.appendChild(val);
      if(p.deal){ const d=document.createElement('span'); d.className='chip'; d.style.borderColor='var(--success)'; d.textContent='Deal'; chips.appendChild(d); }
      const catChip = document.createElement('span'); catChip.className='chip'; catChip.textContent=p.category; chips.appendChild(catChip);
      p.tags.forEach(t=>{ const s=document.createElement('span'); s.className='chip'; s.textContent=t; chips.appendChild(s); });

      node.querySelector('.addcmp').onclick = () => { compareSet.set(p.id, p); render(); };
      node.querySelector('.primary').onclick = () => alert(`This would open the best store link for: \n\n${p.title}`);

      return node;
    }

    // Compare dialog (simple)
    btnCompare.addEventListener('click', () => {
      const arr = Array.from(compareSet.values());
      const lines = [
        'Compare Selected Items:',
        '',
        ...arr.map(x=>`• ${x.title} — $${x.price} — Rating ${x.rating}`)
      ];
      alert(lines.join('\n'));
    });

    // Wire up controls
    [q, cat, maxp, sort, onlyDeals].forEach(el=> el.addEventListener('input', render));

    // initial
    render();
  </script>
</body>
</html>

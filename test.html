<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Amazon Shopping Finder</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      margin: 0;
      padding: 0;
      color: #333;
    }
    header {
      background: #232f3e;
      color: #fff;
      text-align: center;
      padding: 1.5em 1em;
    }
    h1 {
      margin: 0;
      font-size: 1.6em;
    }
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2em 1em;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 1em;
      max-width: 400px;
      width: 100%;
      background: #fff;
      padding: 1.5em;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }
    input[type="text"] {
      padding: 0.8em;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1em;
    }
    select, button {
      padding: 0.8em;
      border-radius: 6px;
      border: none;
      font-size: 1em;
    }
    select {
      background: #f0f0f0;
    }
    button {
      background: #ff9900;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    button:hover {
      background: #e68a00;
    }
    .results {
      margin-top: 2em;
      width: 100%;
      max-width: 600px;
    }
    .item {
      background: #fff;
      border-radius: 8px;
      padding: 1em;
      margin-bottom: 1em;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }
    .item h3 {
      margin: 0 0 0.3em;
    }
    .item a {
      color: #0073e6;
      text-decoration: none;
    }
    .item a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header>
    <h1>Amazon Shopping Finder</h1>
    <p>Find the best products based on your search</p>
  </header>

  <main>
    <form id="searchForm">
      <label for="query">What are you looking for?</label>
      <input type="text" id="query" placeholder="e.g. wireless headphones" required />

      <label for="category">Category (optional)</label>
      <select id="category">
        <option value="">All</option>
        <option value="electronics">Electronics</option>
        <option value="home">Home</option>
        <option value="fashion">Fashion</option>
        <option value="books">Books</option>
      </select>

      <button type="submit">Search on Amazon</button>
    </form>

    <div class="results" id="results"></div>
  </main>

  <script>
    const form = document.getElementById('searchForm');
    const results = document.getElementById('results');

    form.addEventListener('submit', e => {
      e.preventDefault();
      const query = document.getElementById('query').value.trim();
      const category = document.getElementById('category').value;
      if (!query) return;

      // Construct Amazon search URL
      let url = `https://www.amazon.com/s?k=${encodeURIComponent(query)}`;
      if (category) url += `+${encodeURIComponent(category)}`;

      results.innerHTML = `
        <div class="item">
          <h3>Search Results</h3>
          <p>Click below to view <strong>${query}</strong> on Amazon:</p>
          <a href="${url}" target="_blank">Open Amazon Search</a>
        </div>
      `;
    });
  </script>
</body>
</html>
